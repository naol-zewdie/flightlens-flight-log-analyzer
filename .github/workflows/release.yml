name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) to publish:
#   - the wheel and sdist to PyPI (trusted publishing: no token stored here;
#     configure the "pypi" environment and the publisher on pypi.org once),
#   - a multi-arch Docker image (amd64, arm64) to ghcr.io/<owner>/flightlens,
#   - a GitHub release with the CHANGELOG section and the built files.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - id: v
        name: Tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest
      - name: Validation benchmark
        run: uv run python scripts/benchmark.py --out /tmp/validation.md

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv run python scripts/build_dist.py
      - name: The wheel installs and runs on its own
        run: |
          uv venv /tmp/fl && uv pip install --python /tmp/fl/bin/python dist/*.whl
          cd /tmp && /tmp/fl/bin/flightlens version
          /tmp/fl/bin/flightlens demo --data /tmp/demo --seed-only
      - name: SBOM (CycloneDX) of the installed wheel and the bundled web UI
        # kept out of dist/: everything in dist/ is uploaded to PyPI
        run: |
          mkdir sbom
          uvx --from cyclonedx-bom cyclonedx-py environment /tmp/fl/bin/python \
            --of JSON -o "sbom/flightlens-${GITHUB_REF_NAME}-python.cdx.json"
          (cd web && npm ci && npm sbom --sbom-format cyclonedx --omit dev) \
            > "sbom/flightlens-${GITHUB_REF_NAME}-web.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/flightlens
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [check, build, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.check.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* sbom/* --title "FlightLens $GITHUB_REF_NAME" --notes-file notes.md
