site_name: FlightLens
site_description: Automatic drone flight log analysis for PX4 and ArduPilot
docs_dir: docs
strict: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Check reference: checks.md
  - Validation:
      - Benchmark: validation.md
      - Real logs: real-log-results.md
      - Labelled log library: sitl-log-library.md
  - Writing a check: writing-a-check.md
  - Changelog: changelog.md
theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - content.code.copy
    - content.tabs.link
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
